name: Build APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:
    inputs:
      bundle_models:
        description: "Bundle ONNX models into the APK (offline devices)"
        type: boolean
        default: true
      bundle_enhancer:
        description: "Include optional GFPGAN enhancer (+340 MB)"
        type: boolean
        default: true

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODELS_CACHE: ${{ github.workspace }}/.models-cache
      BUNDLE_MODELS: ${{ github.event_name != 'workflow_dispatch' || inputs.bundle_models }}
      BUNDLE_ENHANCER: ${{ github.event_name != 'workflow_dispatch' || inputs.bundle_enhancer }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache ONNX models
        uses: actions/cache@v4
        with:
          path: .models-cache
          key: onnx-models-facefusion-3.0.0-v1

      - name: Write local.properties
        env:
          DEV_PASSPHRASE: ${{ secrets.DEV_PASSPHRASE }}
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          if [ -n "$DEV_PASSPHRASE" ]; then echo "DEV_PASSPHRASE=$DEV_PASSPHRASE" >> local.properties; fi

      - name: Core unit tests (real models)
        run: |
          ./gradlew :app:fetchModels -PbundleModels=true -PbundleEnhancer=$BUNDLE_ENHANCER --console=plain
          mkdir -p $MODELS_CACHE/ex
          if [ ! -f $MODELS_CACHE/ex/target.jpg ]; then
            curl -sL -o $MODELS_CACHE/ex/source.jpg https://huggingface.co/facefusion/examples-3.0.0/resolve/main/source.jpg
            curl -sL -o /tmp/t.mp4 https://huggingface.co/facefusion/examples-3.0.0/resolve/main/target-240p.mp4
            ffmpeg -loglevel error -y -ss 1 -i /tmp/t.mp4 -frames:v 1 $MODELS_CACHE/ex/target.jpg
          fi
          ./gradlew :core:test -Dmodels.dir=$MODELS_CACHE --console=plain

      - name: Build internal (debug) APK
        run: ./gradlew :app:assembleDebug -PbundleModels=$BUNDLE_MODELS -PbundleEnhancer=$BUNDLE_ENHANCER --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FaceSwapStudio-internal-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          compression-level: 0
          retention-days: 14
