# Run from server/: `docker compose -f diffusion_app/docker-compose.yml up -d --build`
# (setup_diffusion.sh drives this; see that script for the full flow — weight download, config generation, etc.)
#
# What's a volume vs. baked into the image, and why:
#   - diffusion_config.yaml : mounted — holds the api_key secret; a config change shouldn't need a rebuild.
#   - diffusion/weights/    : mounted — multi-GB model weights; a rebuild must never re-download or discard these.
#   - diffusion_app/, diffusion_manifest.yaml : baked into the image (see Dockerfile) — this is the code/catalog,
#     rebuilt (docker compose ... --build) whenever either changes.
services:
  diffusion-server:
    build:
      context: ..            # server/ — Dockerfile's COPY paths (diffusion_app/, diffusion_manifest.yaml, ...)
      dockerfile: diffusion_app/Dockerfile
    image: faceswap-diffusion:latest
    restart: unless-stopped
    # Loopback-only publish: reached via the ONNX server's /v1/diffusion/{path} proxy route (app/main.py), never
    # exposed directly — same reasoning as DiffusionConfig.host's own docstring.
    ports:
      - "127.0.0.1:8444:8444"
    volumes:
      - ../diffusion_config.yaml:/app/diffusion_config.yaml:ro
      - ../diffusion/weights:/app/diffusion/weights
    environment:
      - FSW_DIFFUSION_CONFIG=/app/diffusion_config.yaml
      - NVIDIA_VISIBLE_DEVICES=${DIFFUSION_DEVICE:-0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${DIFFUSION_DEVICE:-0}"]
              capabilities: [gpu]

  # One-off weight downloader: `docker compose -f diffusion_app/docker-compose.yml run --rm diffusion-download
  # <backend_ids...>` — shares the same image (so huggingface_hub etc. are already present), overrides the
  # long-running server CMD with the download script instead.
  diffusion-download:
    build:
      context: ..
      dockerfile: diffusion_app/Dockerfile
    image: faceswap-diffusion:latest
    entrypoint: ["python", "/app/download_diffusion_weights.py"]
    volumes:
      - ../diffusion/weights:/app/diffusion/weights
      - ../diffusion_manifest.yaml:/app/diffusion_manifest.yaml:ro
    profiles: ["tools"]  # never started by `up`; only via an explicit `run`
