# Model catalog, mirroring the Android app's ModelCatalog in
# app/src/main/java/com/faceswap/studio/data/ModelManager.kt — same ids, same source URLs, same groups. Keep the
# two in sync: a client and a server built from the same commit must always agree on what a model id means.
#
# group: required | recommended | swappers | enhancers | studio | live  (matches ModelGroup in Settings.kt)
# role: detector | recognizer | swapper | enhancer | analyser | parser | landmarker | background | upscaler |
#       studio | live  (server-side only; used for grouping in setup prompts and /v1/health, not for any
#       model-specific inference logic — see app/inference.py's module docstring)
#
